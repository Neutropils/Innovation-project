name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  app:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm test
      - if: matrix.app == 'frontend'
        run: npm run build

  # Single "test" check for branch protection - passes only if backend AND frontend pass
  test:
    needs: app
    runs-on: ubuntu-latest
    steps:
      - run: echo "Backend and frontend checks passed"
